<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来源看板</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">
  <div class="wrap">

    <header class="topbar">
      <div class="brand">
        <span class="brand-name">来源看板</span>
        <span class="brand-sub">只盯几个来源，把看到的东西贴进来</span>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-export" class="btn btn-ghost">导出数据</button>
        <button type="button" id="btn-import" class="btn btn-ghost">导入数据</button>
        <input type="file" id="file-import" accept=".json,application/json" hidden>
      </div>
    </header>

    <p id="focus-bar" class="focus-bar" hidden></p>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">我盯的来源</h2>
        <button type="button" id="btn-add-source" class="btn btn-primary">添加来源</button>
      </div>
      <p id="limit-hint" class="limit-hint" hidden></p>
      <div id="source-grid" class="source-grid"></div>
      <p id="source-empty" class="empty" hidden></p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">时间线</h2>
        <button type="button" id="btn-add-item" class="btn btn-primary">记录一条</button>
      </div>
      <div id="filter-bar" class="filter-bar"></div>
      <ul id="timeline" class="timeline"></ul>
    </section>

    <footer class="foot">
      <span>数据只存在这台电脑的这个浏览器里，不上传、不联网。</span>
      <span>记得每周点一次「导出数据」，留一份能拷走的备份。</span>
    </footer>

  </div>

  <div id="modal-root"></div>

  <!-- 全部用传统 <script src>，按顺序加载。
       绝不用 type="module"——Day 5 实验 3 实测过，本地双击的页面会直接白屏。 -->
  <script src="assets/config.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/rules.js"></script>
  <script src="assets/ui.js"></script>
</body>
</html>
