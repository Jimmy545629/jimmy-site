<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jimmy 的网站 · 建设中</title>
<style>
  :root {
    --ink: #1a1d21;
    --ink-soft: #5b6472;
    --line: #e6e9ee;
    --brand: #2f6feb;
    --bg: #f7f9fc;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.7;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 44px 40px;
    max-width: 620px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(24, 39, 75, 0.07);
  }
  .badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand);
    background: #eaf1fe;
    border-radius: 999px;
    padding: 4px 14px;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 18px 0 10px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 16px;
  }
  .plan {
    list-style: none;
    margin: 28px 0 0;
    border-top: 1px solid var(--line);
  }
  .plan li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  .plan b {
    min-width: 58px;
    color: var(--ink);
    font-weight: 600;
  }
  .plan .txt { flex: 1; color: var(--ink-soft); }
  .done {
    font-size: 12px;
    font-weight: 600;
    color: #1a7f4b;
    background: #e6f6ed;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .todo {
    font-size: 12px;
    font-weight: 600;
    color: #8a93a1;
    background: #f1f3f7;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  footer {
    margin-top: 26px;
    font-size: 13px;
    color: #98a1af;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Day 2 · 占位页</span>
    <h1>Jimmy 的网站</h1>
    <p class="sub">
      这个页面已经成功提交到 GitHub 了。现在它只是一个占位页，
      接下来它会长成一个真正能用的网站。
    </p>

    <ul class="plan">
      <li>
        <b>Day 2</b>
        <span class="txt">创建 GitHub 仓库 + 完成第一次提交</span>
        <span class="done">已完成</span>
      </li>
      <li>
        <b>Day 7</b>
        <span class="txt">上线 MVP —— 第一版有真实功能</span>
        <span class="todo">待开始</span>
      </li>
      <li>
        <b>Day 23</b>
        <span class="txt">接入数据库，开始存真实数据</span>
        <span class="todo">待开始</span>
      </li>
    </ul>

    <footer>
      <span>jimmy-site</span>
      <span>本页最后更新：Day 2</span>
    </footer>
  </main>
</body>
</html>
